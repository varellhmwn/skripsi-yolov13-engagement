<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dashboard Pembelajaran Mahasiswa dengan Deteksi Emosi Real-time YOLOv13">
    <title>Login — Engagement Learning Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0a0e1a;
            overflow: hidden;
            position: relative;
        }

        /* Animated background */
        .bg-grid {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(rgba(99, 102, 241, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(99, 102, 241, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 0;
        }

        .bg-glow {
            position: fixed;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            z-index: 0;
            animation: float 8s ease-in-out infinite;
        }
        .bg-glow.glow-1 { background: #6366f1; top: -200px; left: -100px; }
        .bg-glow.glow-2 { background: #8b5cf6; bottom: -200px; right: -100px; animation-delay: 4s; }
        .bg-glow.glow-3 { background: #06b6d4; top: 50%; left: 50%; transform: translate(-50%, -50%); animation-delay: 2s; opacity: 0.08; }

        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            33% { transform: translate(30px, -20px); }
            66% { transform: translate(-20px, 30px); }
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 460px;
            padding: 20px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .login-header .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6, #a78bfa);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3);
            animation: pulse-glow 3s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 8px 32px rgba(99, 102, 241, 0.3); }
            50% { box-shadow: 0 8px 48px rgba(99, 102, 241, 0.5); }
        }

        .login-header h1 {
            color: #f1f5f9;
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        .login-header p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .login-card {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(99, 102, 241, 0.15);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 
                0 24px 48px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
            letter-spacing: 0.02em;
        }

        .form-group input {
            width: 100%;
            padding: 14px 18px;
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid rgba(99, 102, 241, 0.2);
            border-radius: 14px;
            color: #f1f5f9;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder {
            color: #475569;
        }

        .form-group input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
            background: rgba(30, 41, 59, 0.9);
        }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.02em;
        }

        .btn-login::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #818cf8, #a78bfa);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
        }

        .btn-login:hover::before { opacity: 1; }

        .btn-login span {
            position: relative;
            z-index: 1;
        }

        .btn-login:active { transform: translateY(0); }

        .features {
            display: flex;
            gap: 16px;
            margin-top: 32px;
            padding-top: 28px;
            border-top: 1px solid rgba(99, 102, 241, 0.1);
        }

        .feature-item {
            flex: 1;
            text-align: center;
        }

        .feature-item .icon {
            font-size: 1.5rem;
            margin-bottom: 6px;
        }

        .feature-item span {
            display: block;
            color: #64748b;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .version-badge {
            text-align: center;
            margin-top: 24px;
            color: #475569;
            font-size: 0.75rem;
        }

        .version-badge span {
            background: rgba(99, 102, 241, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
            border: 1px solid rgba(99, 102, 241, 0.15);
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow glow-1"></div>
    <div class="bg-glow glow-2"></div>
    <div class="bg-glow glow-3"></div>

    <div class="login-container">
        <div class="login-header">
            <div class="logo-icon">🎓</div>
            <h1>Engagement Learning</h1>
            <p>Dashboard Pembelajaran Interaktif dengan<br>Deteksi Emosi Real-time AI</p>
        </div>

        <form class="login-card" action="/login" method="POST" id="loginForm">
            <div class="form-group">
                <label for="name">Nama Mahasiswa</label>
                <input type="text" id="name" name="name" placeholder="Masukkan nama lengkap" required autocomplete="name">
            </div>
            <div class="form-group">
                <label for="nim">NIM (Nomor Induk Mahasiswa)</label>
                <input type="text" id="nim" name="nim" placeholder="Contoh: 20220801257" required autocomplete="off">
            </div>
            <button type="submit" class="btn-login">
                <span>Masuk ke Dashboard →</span>
            </button>

            <div class="features">
                <div class="feature-item">
                    <div class="icon">📹</div>
                    <span>Real-time<br>Camera</span>
                </div>
                <div class="feature-item">
                    <div class="icon">🧠</div>
                    <span>Emotion<br>Detection</span>
                </div>
                <div class="feature-item">
                    <div class="icon">📊</div>
                    <span>Learning<br>Analytics</span>
                </div>
            </div>
        </form>

        <div class="version-badge">
            <span>YOLOv13 — Master Final 4-Class Model</span>
        </div>
    </div>
</body>
</html>
